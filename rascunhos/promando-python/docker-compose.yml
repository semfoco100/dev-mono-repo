services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # O Postgres oficial mapeia as variáveis do .env automaticamente se os nomes baterem.
      # Se no seu .env os nomes forem diferentes de POSTGRES_USER e POSTGRES_PASSWORD, faça assim:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  frontend_node_modules: