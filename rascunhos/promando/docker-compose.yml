version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: promando_db_dev
    environment:
      POSTGRES_DB: ${DB_NAME:-promando_dev}
      POSTGRES_USER: ${DB_USER:-promando}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-promando_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-promando}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promando_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: promando_backend_dev
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-promando_dev}
      DB_USER: ${DB_USER:-promando}
      DB_PASSWORD: ${DB_PASSWORD:-promando_dev}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - promando_network

  redis:
    image: redis:7-alpine
    container_name: promando_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - promando_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: promando_frontend_dev
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - promando_network
    command: npm run dev

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  promando_network:
    driver: bridge
