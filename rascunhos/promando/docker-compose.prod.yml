version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: promando_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - promando_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: promando_backend_prod
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - promando_network

  redis:
    image: redis:7-alpine
    container_name: promando_redis_prod
    volumes:
      - redis_data_prod:/data
    restart: always
    networks:
      - promando_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${API_URL}
    container_name: promando_frontend_prod
    environment:
      NODE_ENV: production
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - promando_network

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  promando_network:
    driver: bridge
